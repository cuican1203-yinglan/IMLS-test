<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线能力测试</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f5f7fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: white; width: 100%; max-width: 500px; padding: 30px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); }
        .progress { color: #888; font-size: 14px; margin-bottom: 10px; font-weight: 500; }
        .quiz { font-size: 20px; font-weight: 600; color: #1a1a1a; margin-bottom: 24px; line-height: 1.4; }
        input { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 16px; margin-bottom: 24px; outline: none; transition: border 0.2s; }
        input:focus { border-color: #3b82f6; }
        button { width: 100%; background: #3b82f6; color: white; border: none; padding: 14px; font-size: 16px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #2563eb; }
        .hidden { display: none; }
        textarea { width: 100%; height: 180px; padding: 12px; font-family: monospace; border: 2px solid #e2e8f0; border-radius: 8px; margin-top: 15px; background: #fafafa; }
        .summary { font-size: 16px; color: #333; line-height: 1.6; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="card" id="exam-card">
    <div class="progress" id="progress-text">题目：1 / 15</div>
    <div class="quiz" id="quiz-text">加载中...</div>
    <input type="text" id="answer-input" placeholder="请输入你的答案" autofocus autocomplete="off">
    <button id="next-btn" onclick="submitAnswer()">下一题</button>
</div>

<div class="card hidden" id="result-card">
    <div class="quiz">🎉 答题已完成</div>
    <div class="summary" id="summary-text">正在生成报告...</div>
    <p style="font-size: 14px; color: #666; font-weight: bold;">答题原始 JSON 数据 (可复制)：</p>
    <textarea id="json-output" readonly></textarea>
</div>

<script>
    const questions = [
        { id: 1, quiz: "8 + 7 = ?", answer: "15" },
        { id: 2, quiz: "14 − 6 = ?", answer: "8" },
        { id: 3, quiz: "2 × 3 = ?", answer: "6" },
        { id: 4, quiz: "6 ÷ 2 = ?", answer: "3" },
        { id: 5, quiz: "数列：2, 4, 6, 8, 下一个数是？", answer: "10" },
        { id: 6, quiz: "数列：12, 10, 8, 6, 下一个数是？", answer: "4" },
        { id: 7, quiz: "比较两个数：31 和 13，哪个更大？", answer: "31" },
        { id: 8, quiz: "比较两个数：27 和 34，哪个更小？", answer: "27" },
        { id: 9, quiz: "如果有 7 个苹果，再增加 5 个，一共有多少个？", answer: "12" },
        { id: 10, quiz: "一个盒子中有 16 个球，拿走 9 个，还剩多少个？", answer: "7" },
        { id: 11, quiz: "当前温度为 17°C，下降 5°C 后是多少？", answer: "12" },
        { id: 12, quiz: "一辆车以每分钟 4 公里速度行驶，3 分钟共行驶多少公里？", answer: "12" },
        { id: 13, quiz: "水与盐的比例为 5:1，当水为 10 克时，盐是多少克？", answer: "2" },
        { id: 14, quiz: "一个细胞每次分裂为 2 个，连续分裂 3 次后共有多少个细胞？", answer: "8" },
        { id: 15, quiz: "1 KB = 1024 bytes，2 KB 等于多少 bytes？", answer: "2048" }
    ];

    let currentIndex = 0;
    let startTime = 0;
    const results = [];

    function loadQuestion() {
        if (currentIndex < questions.length) {
            document.getElementById('progress-text').innerText = `题目：${currentIndex + 1} / ${questions.length}`;
            document.getElementById('quiz-text').innerText = questions[currentIndex].quiz;
            document.getElementById('answer-input').value = '';
            document.getElementById('answer-input').focus();
            if(currentIndex === questions.length - 1) {
                document.getElementById('next-btn').innerText = '提交问卷';
            }
            startTime = Date.now();
        } else {
            showResults();
        }
    }

    function submitAnswer() {
        const endTime = Date.now();
        const duration = ((endTime - startTime) / 1000).toFixed(2);
        const userAnswer = document.getElementById('answer-input').value.trim();
        const currentQuiz = questions[currentIndex];
        
        const isCorrect = userAnswer === currentQuiz.answer;

        results.push({
            questionId: currentQuiz.id,
            quiz: currentQuiz.quiz,
            userAnswer: userAnswer,
            correctAnswer: currentQuiz.answer,
            duration: parseFloat(duration),
            isCorrect: isCorrect
        });

        currentIndex++;
        loadQuestion();
    }

    function showResults() {
        document.getElementById('exam-card').classList.add('hidden');
        document.getElementById('result-card').classList.remove('hidden');

        const correctCount = results.filter(r => r.isCorrect).length;
        const totalDuration = results.reduce((acc, curr) => acc + curr.duration, 0).toFixed(2);
        
        document.getElementById('summary-text').innerHTML = `
            答对题数：<strong>${correctCount} / ${questions.length}</strong><br>
            正确率：<strong>${((correctCount/questions.length)*100).toFixed(0)}%</strong><br>
            总共耗时：<strong>${totalDuration} 秒</strong>
        `;
        
        document.getElementById('json-output').value = JSON.stringify(results, null, 2);
    }

    // Allow pressing "Enter" to submit
    document.getElementById('answer-input').addEventListener('keypress',
